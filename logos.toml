[build]
cgo = "forbid"

[lints]
perf = "deny"
style = "deny"
suspicious = "deny"
portability = "deny"
pedantic = "warn"

[capabilities]
transitive_exec_allowlist = ["golang.org/x/sys/unix", "modernc.org/libc"]
transitive_net_allowlist = ["golang.org/x/sys/unix", "modernc.org/libc", "github.com/go-sql-driver/mysql/**", "github.com/jackc/pgx/v5/pgconn/**", "github.com/microsoft/go-mssqldb/**"]
