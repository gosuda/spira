version: "2"
plugins:
  - name: spira
    process: { cmd: sqlc-gen-spira, format: json }
rules:
  - name: no-unbounded-write
    message: "UPDATE and DELETE need a WHERE clause"
    rule: 'query.sql.matches("(?is)^\\s*(update|delete)\\b") && !query.sql.matches("(?is)\\bwhere\\b")'
sql:
  - engine: sqlite
    schema: db/migrations
    queries: db/queries
    rules: [no-unbounded-write]
    codegen:
      - plugin: spira
        out: db/store
        options:
          package: store
          tables:
            products: { type: Product, key: id, key_type: ProductID }
            users: { type: User, key: id, key_type: UserID }
            sessions: { type: Session, key: id_hash, key_type: SessionID }
            cart_items: { type: CartItem, key: id, key_type: CartItemID }
            orders: { type: Order, key: id, key_type: OrderID, version: version }
            order_lines: { type: OrderLine, key: id, key_type: OrderLineID }
          refs:
            sessions.user_id: users
            cart_items.product_id: products
            orders.user_id: users
            order_lines.order_id: orders
            order_lines.product_id: products
          overrides: {}
